<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="0.75" opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  
  <!-- Outer Frame -->
  <rect x="60" y="60" width="1080" height="555" rx="8" fill="#111111" stroke="#303030" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#262626" stroke-width="1" />
  <circle cx="100" cy="90" r="5" fill="#3A3A3A" />
  <circle cx="120" cy="90" r="5" fill="#2E2E2E" />
  <circle cx="140" cy="90" r="5" fill="#2E2E2E" />
  <text x="180" y="95" fill="#737373" font-family="monospace" font-size="14" letter-spacing="1">kinetix.design/tokens/typography</text>
  
  <!-- Main Editorial Layout -->
  <!-- Left column: Typography specimen -->
  <rect x="100" y="160" width="480" height="415" rx="4" fill="#161616" stroke="#2B2B2B" stroke-width="1" />
  <text x="130" y="210" fill="#737373" font-family="monospace" font-size="12" letter-spacing="2">SPECIMEN // SCALE 01</text>
  <text x="130" y="270" fill="#F5F5F5" font-family="sans-serif" font-weight="900" font-size="44" letter-spacing="-1">Kinetic Sans</text>
  <text x="130" y="315" fill="#A3A3A3" font-family="sans-serif" font-size="16" letter-spacing="0">Variable weight (100–900) with fluid optical sizing.</text>
  
  <!-- Interactive Tokens Preview -->
  <rect x="130" y="350" width="420" height="50" rx="3" fill="#1C1C1C" stroke="#333333" stroke-width="1" />
  <text x="150" y="380" fill="#F5F5F5" font-family="monospace" font-size="13">--font-display: 'Kinetic', clamp(2rem, 5vw, 4.5rem);</text>
  
  <rect x="130" y="415" width="420" height="50" rx="3" fill="#1C1C1C" stroke="#333333" stroke-width="1" />
  <text x="150" y="445" fill="#F5F5F5" font-family="monospace" font-size="13">--ease-kinetic: cubic-bezier(0.16, 1, 0.3, 1);</text>
  
  <rect x="130" y="480" width="130" height="40" rx="2" fill="#F5F5F5" />
  <text x="155" y="505" fill="#0A0A0A" font-family="sans-serif" font-weight="bold" font-size="13">Test Scale</text>
  
  <rect x="275" y="480" width="130" height="40" rx="2" fill="transparent" stroke="#444444" stroke-width="1" />
  <text x="305" y="505" fill="#A3A3A3" font-family="sans-serif" font-size="13">Export CSS</text>

  <!-- Right column: Component Cards & Metrics -->
  <rect x="620" y="160" width="480" height="195" rx="4" fill="#161616" stroke="#2B2B2B" stroke-width="1" />
  <text x="650" y="200" fill="#737373" font-family="monospace" font-size="12" letter-spacing="2">SYSTEM METRICS</text>
  <text x="650" y="255" fill="#F5F5F5" font-family="sans-serif" font-weight="bold" font-size="38">0.0kb</text>
  <text x="760" y="255" fill="#737373" font-family="sans-serif" font-size="14">Runtime JS Overhead</text>
  <text x="650" y="305" fill="#A3A3A3" font-family="sans-serif" font-size="14">100% Native CSS Custom Properties + Fluid Clamp Rules.</text>
  <line x1="650" y1="325" x2="1060" y2="325" stroke="#262626" stroke-width="1" />

  <rect x="620" y="380" width="480" height="195" rx="4" fill="#161616" stroke="#2B2B2B" stroke-width="1" />
  <text x="650" y="420" fill="#737373" font-family="monospace" font-size="12" letter-spacing="2">ACCESSIBILITY COMPLIANCE</text>
  <text x="650" y="475" fill="#F5F5F5" font-family="sans-serif" font-weight="bold" font-size="38">18.4 : 1</text>
  <text x="810" y="475" fill="#737373" font-family="sans-serif" font-size="14">Contrast Ratio (AAA)</text>
  <text x="650" y="525" fill="#A3A3A3" font-family="sans-serif" font-size="14">Strict WCAG 2.2 Level AAA compliant contrast validation.</text>
</svg>
