<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#222222" stroke-width="0.5" opacity="0.7"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="675" fill="url(#bgGrad2)" />
  <rect width="1200" height="675" fill="url(#grid2)" />
  
  <!-- Outer Window -->
  <rect x="60" y="60" width="1080" height="555" rx="8" fill="#111111" stroke="#303030" stroke-width="1.5" />
  
  <!-- Navigation bar -->
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#262626" stroke-width="1" />
  <circle cx="100" cy="90" r="5" fill="#3A3A3A" />
  <circle cx="120" cy="90" r="5" fill="#2E2E2E" />
  <circle cx="140" cy="90" r="5" fill="#2E2E2E" />
  <text x="180" y="95" fill="#888888" font-family="monospace" font-size="14" letter-spacing="1">devpulse.internal/telemetry/cwv-live</text>
  <rect x="1000" y="75" width="100" height="30" rx="3" fill="#1C1C1C" stroke="#383838" stroke-width="1" />
  <circle cx="1018" cy="90" r="4" fill="#F5F5F5" />
  <text x="1030" y="94" fill="#F5F5F5" font-family="monospace" font-size="11">LIVE 60FPS</text>
  
  <!-- KPI Metrics Grid -->
  <rect x="100" y="150" width="300" height="120" rx="4" fill="#161616" stroke="#2A2A2A" stroke-width="1" />
  <text x="125" y="180" fill="#737373" font-family="monospace" font-size="11" letter-spacing="1.5">LCP (LARGEST CONTENTFUL PAINT)</text>
  <text x="125" y="230" fill="#F5F5F5" font-family="sans-serif" font-weight="900" font-size="36">0.82 s</text>
  <text x="250" y="230" fill="#737373" font-family="monospace" font-size="12">P75: FAST</text>

  <rect x="450" y="150" width="300" height="120" rx="4" fill="#161616" stroke="#2A2A2A" stroke-width="1" />
  <text x="475" y="180" fill="#737373" font-family="monospace" font-size="11" letter-spacing="1.5">INP (INTERACTION TO NEXT PAINT)</text>
  <text x="475" y="230" fill="#F5F5F5" font-family="sans-serif" font-weight="900" font-size="36">24 ms</text>
  <text x="590" y="230" fill="#737373" font-family="monospace" font-size="12">SUB-FRAME</text>

  <rect x="800" y="150" width="300" height="120" rx="4" fill="#161616" stroke="#2A2A2A" stroke-width="1" />
  <text x="825" y="180" fill="#737373" font-family="monospace" font-size="11" letter-spacing="1.5">CLS (CUMULATIVE LAYOUT SHIFT)</text>
  <text x="825" y="230" fill="#F5F5F5" font-family="sans-serif" font-weight="900" font-size="36">0.000</text>
  <text x="965" y="230" fill="#737373" font-family="monospace" font-size="12">ZERO JANK</text>

  <!-- Big Telemetry Waveform Graph -->
  <rect x="100" y="300" width="1000" height="275" rx="4" fill="#151515" stroke="#2A2A2A" stroke-width="1" />
  <text x="130" y="335" fill="#737373" font-family="monospace" font-size="12" letter-spacing="2">REAL-TIME RTT &amp; RENDERING LATENCY (LAST 60 SECONDS)</text>
  
  <!-- Graph grid lines -->
  <line x1="130" y1="370" x2="1060" y2="370" stroke="#242424" stroke-dasharray="4" stroke-width="1" />
  <line x1="130" y1="430" x2="1060" y2="430" stroke="#242424" stroke-dasharray="4" stroke-width="1" />
  <line x1="130" y1="490" x2="1060" y2="490" stroke="#242424" stroke-dasharray="4" stroke-width="1" />
  <line x1="130" y1="540" x2="1060" y2="540" stroke="#333333" stroke-width="1" />

  <!-- Waveform polyline -->
  <polyline
    fill="none"
    stroke="#F5F5F5"
    stroke-width="2.5"
    points="
      130,510 180,500 240,480 300,505 360,460 420,440 
      480,470 540,430 600,410 660,445 720,400 780,420 
      840,390 900,410 960,380 1020,395 1060,375
    "
  />
  <circle cx="1060" cy="375" r="5" fill="#F5F5F5" />
  <circle cx="1060" cy="375" r="9" fill="none" stroke="#F5F5F5" stroke-width="1" opacity="0.6" />
</svg>
