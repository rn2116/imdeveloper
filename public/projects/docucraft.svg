<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1D1D1D" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="675" fill="url(#bgGrad3)" />
  <rect width="1200" height="675" fill="url(#grid3)" />
  
  <!-- Outer Frame -->
  <rect x="60" y="60" width="1080" height="555" rx="8" fill="#0E0E0E" stroke="#303030" stroke-width="1.5" />
  
  <!-- Top Bar -->
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#262626" stroke-width="1" />
  <circle cx="100" cy="90" r="5" fill="#3A3A3A" />
  <circle cx="120" cy="90" r="5" fill="#2E2E2E" />
  <circle cx="140" cy="90" r="5" fill="#2E2E2E" />
  <text x="180" y="95" fill="#737373" font-family="monospace" font-size="14">docucraft // editorial_manifesto.md</text>
  
  <text x="960" y="95" fill="#A3A3A3" font-family="monospace" font-size="12">WORDS: 1,420 • 98 WPM</text>

  <!-- Left: Raw Markdown Editor Pane -->
  <rect x="90" y="150" width="480" height="430" rx="4" fill="#141414" stroke="#252525" stroke-width="1" />
  <text x="120" y="190" fill="#737373" font-family="monospace" font-size="12">RAW SOURCE (AST-PARSED)</text>
  <line x1="120" y1="205" x2="540" y2="205" stroke="#222222" stroke-width="1" />
  
  <text x="120" y="240" fill="#F5F5F5" font-family="monospace" font-size="15"># The Architecture of Silence</text>
  <text x="120" y="280" fill="#A3A3A3" font-family="monospace" font-size="14">&gt; Good software is quiet.</text>
  <text x="120" y="305" fill="#A3A3A3" font-family="monospace" font-size="14">&gt; It respects the user's attention.</text>
  <text x="120" y="350" fill="#E5E5E5" font-family="monospace" font-size="14">When constructing digital spaces,</text>
  <text x="120" y="375" fill="#E5E5E5" font-family="monospace" font-size="14">we eliminate ornamental distractions.</text>
  <text x="120" y="400" fill="#E5E5E5" font-family="monospace" font-size="14">Form follows cognitive intent.</text>
  
  <rect x="120" y="440" width="420" height="70" rx="3" fill="#1C1C1C" stroke="#2B2B2B" stroke-width="1" />
  <text x="140" y="470" fill="#F5F5F5" font-family="monospace" font-size="13">```typescript</text>
  <text x="140" y="493" fill="#A3A3A3" font-family="monospace" font-size="13">const focus = craft &amp;&amp; clarity;</text>

  <!-- Right: Formatted Typography View -->
  <rect x="610" y="150" width="500" height="430" rx="4" fill="#161616" stroke="#252525" stroke-width="1" />
  <text x="640" y="190" fill="#737373" font-family="monospace" font-size="12">LIVE TYPESETTING PREVIEW</text>
  <line x1="640" y1="205" x2="1080" y2="205" stroke="#222222" stroke-width="1" />
  
  <text x="640" y="250" fill="#F5F5F5" font-family="sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">The Architecture of Silence</text>
  
  <!-- Blockquote bar -->
  <rect x="640" y="275" width="3" height="45" fill="#F5F5F5" />
  <text x="660" y="295" fill="#A3A3A3" font-family="sans-serif" font-style="italic" font-size="15">Good software is quiet.</text>
  <text x="660" y="315" fill="#A3A3A3" font-family="sans-serif" font-style="italic" font-size="15">It respects the user's attention.</text>
  
  <text x="640" y="365" fill="#D4D4D4" font-family="sans-serif" font-size="15" letter-spacing="0.2">When constructing digital spaces, we eliminate</text>
  <text x="640" y="390" fill="#D4D4D4" font-family="sans-serif" font-size="15" letter-spacing="0.2">ornamental distractions. Form follows intent.</text>

  <!-- Export Status -->
  <rect x="640" y="450" width="200" height="38" rx="2" fill="#F5F5F5" />
  <text x="665" y="474" fill="#0A0A0A" font-family="sans-serif" font-weight="bold" font-size="12">Instant PDF / Markdown</text>
</svg>
