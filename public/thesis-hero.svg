<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Ilustrasi konseptual segmentasi GMM: dua cluster overlapping pada ruang CAR-LDR">
  <defs>
    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F5F5F5" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="gradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3A3A3" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#A3A3A3" stop-opacity="0.01" />
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="blurMedium" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Background grid (subtle editorial) -->
  <rect width="1000" height="420" fill="#0A0A0A" />
  <g stroke="#1A1A1A" stroke-width="1">
    <path d="M0 140 L1000 140" />
    <path d="M300 0 L300 420" />
    <path d="M700 0 L700 420" />
  </g>
  <g font-family="var(--font-geist-mono), monospace" font-size="11" fill="#303030" text-anchor="middle">
    <text x="300" y="405">CAR ↑</text>
    <text x="700" y="405">LDR ↑</text>
  </g>

  <!-- Cluster A: Stable (left) -->
  <ellipse cx="300" cy="160" rx="150" ry="95" fill="url(#gradA)" filter="url(#blurSoft)" />
  <ellipse cx="300" cy="160" rx="110" ry="70" fill="none" stroke="#F5F5F5" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="6 4" />
  <circle cx="300" cy="160" r="6" fill="#F5F5F5" />
  <g font-size="12" fill="#F5F5F5" font-family="var(--font-geist-sans), sans-serif" text-anchor="middle" font-weight="600" letter-spacing="0.05em">
    <text x="300" y="148">Cluster Stable</text>
    <text x="300" y="164" font-size="10" font-family="var(--font-geist-mono), monospace" font-weight="400" fill="#A3A3A3" letter-spacing="0">BRI • BNI • Mandiri</text>
  </g>

  <!-- Cluster B: Risk (right) -->
  <ellipse cx="700" cy="210" rx="130" ry="85" fill="url(#gradB)" filter="url(#blurSoft)" />
  <ellipse cx="700" cy="210" rx="95" ry="62" fill="none" stroke="#A3A3A3" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 4" />
  <circle cx="700" cy="210" r="6" fill="#A3A3A3" />
  <g font-size="12" fill="#F5F5F5" font-family="var(--font-geist-sans), sans-serif" text-anchor="middle" font-weight="600" letter-spacing="0.05em">
    <text x="700" y="198">Cluster Risk</text>
    <text x="700" y="214" font-size="10" font-family="var(--font-geist-mono), monospace" font-weight="400" fill="#A3A3A3" letter-spacing="0">BTN (anomali LDR)</text>
  </g>

  <!-- Fuzzy boundary zone between clusters -->
  <ellipse cx="495" cy="185" rx="165" ry="105" fill="none" stroke="#F5F5F5" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 3" />
  <path d="M410 130 Q495 185 580 130" fill="none" stroke="#F5F5F5" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4 4" />
  <g font-size="10" fill="#A3A3A3" font-family="var(--font-geist-mono), monospace" text-anchor="middle">
    <text x="495" y="122">Zona transisi (fuzzy boundary)</text>
    <text x="495" y="134" font-size="9" fill="#666666">BTN: 47,19% / 52,81%</text>
  </g>

  <!-- Membership probability dots along boundary -->
  <g fill="#F5F5F5" opacity="0.35">
    <circle cx="440" cy="155" r="3" />
    <circle cx="470" cy="168" r="2" />
    <circle cx="500" cy="180" r="3" />
    <circle cx="530" cy="192" r="2" />
    <circle cx="560" cy="205" r="3" />
  </g>

  <!-- Conceptual data points -->
  <g fill="#F5F5F5" opacity="0.25">
    <circle cx="250" cy="130" r="2.5" />
    <circle cx="320" cy="185" r="2.5" />
    <circle cx="280" cy="205" r="2.5" />
    <circle cx="640" cy="240" r="2.5" />
    <circle cx="740" cy="185" r="2.5" />
    <circle cx="690" cy="150" r="2.5" />
  </g>

  <!-- Caption -->
  <text x="500" y="400" font-size="10" fill="#666666" font-family="var(--font-geist-mono), monospace" text-anchor="middle">
    Ilustrasi konseptual — bukan hasil empiris dari dataset asli
  </text>
</svg>
